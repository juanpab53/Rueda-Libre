<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Rueda Libre</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-slate-950">
    <main class="flex min-h-screen items-center justify-center p-6">
        <section class="w-full max-w-3xl space-y-6 bg-slate-900 p-8 sm:p-12">
            <p class="text-xs font-semibold uppercase tracking-widest text-amber-400">Nuevo · Jueves a sábado</p>
            <h1 class="text-4xl font-bold leading-tight tracking-tight text-white sm:text-6xl">Rueda Nocturna</h1>
            <p class="max-w-xl text-lg leading-relaxed text-slate-300 sm:text-xl">Descubre Medellín en bici cuando se encienden las luces</p>
            <div class="flex items-center space-x-8">
                <p class="text-2xl font-bold text-white">3 rutas</p>
                <p class="text-2xl font-bold text-amber-400">Desde $55.000</p>
            </div>

            <!-- Botones -->
            <div class="flex flex-wrap gap-4">
                <!-- Principal -->
                <a href="#inscripcion"
                    class="inline-block rounded-lg bg-amber-400 px-8 py-4 text-center text-sm font-bold uppercase tracking-widest text-slate-950 shadow-md hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-amber-200">
                    Inscríbete
                </a>

                <!-- Secundario -->
                <a href="#rutas"
                    class="inline-block rounded-lg bg-slate-700 px-8 py-4 text-center text-sm font-bold uppercase tracking-widest text-white shadow hover:bg-slate-600 focus:outline-none focus:ring-4 focus:ring-slate-400">
                    Ver rutas
                </a>

                <!-- Contorno -->
                <a href="#info"
                    class="inline-block rounded-lg border-2 border-amber-400 bg-transparent px-8 py-4 text-center text-sm font-bold uppercase tracking-widest text-amber-400 hover:bg-amber-400 hover:text-slate-950 focus:outline-none focus:ring-4 focus:ring-amber-200">
                    Más información
                </a>
            </div>
        </section>
    </main>
</body>

</html>
